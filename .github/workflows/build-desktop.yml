name: Build Desktop Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2025-vs2026
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      LITELAUNCHER_REQUIRE_NATIVE_CAPTURE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build LiteSnap native addon
        shell: pwsh
        run: node scripts/build-native.cjs --require

      - name: Build Windows packages (NSIS + Portable)
        shell: pwsh
        run: |
          node scripts/clean-release.cjs
          pnpm exec tsc
          node scripts/copy-assets.cjs
          # Keep a full FTS pack for on-demand download, then ship slim db in the installer.
          if (-not (Test-Path "dist/assets/ecdict.db")) {
            throw "dist/assets/ecdict.db is missing after copy-assets"
          }
          node scripts/build-dictionary-pack.cjs
          node scripts/prepare-slim-dictionary-dist.cjs
          if (-not (Test-Path "release/ecdict-fts.db")) {
            throw "release/ecdict-fts.db is missing after build-dictionary-pack"
          }
          if (-not (Test-Path "dist/native/litesnap-capture.node")) {
            throw "dist/native/litesnap-capture.node is missing after build"
          }
          pnpm exec electron-builder --win --x64 --publish never
          node scripts/verify-release-output.cjs win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: litelauncher-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
            release/ecdict-fts.db

  build-macos:
    name: macOS universal updater assets
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export mac signing env
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}" ] && [ -n "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" ] && [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            {
              echo "CSC_LINK=${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}"
              echo "CSC_KEY_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
              echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
            } >> "$GITHUB_ENV"
            echo "Using Apple signing secrets for macOS release packaging."
          else
            echo "::warning::Apple signing secrets are missing; continuing with unsigned macOS release artifacts."
          fi

      - name: Build macOS x64 + arm64 packages
        run: |
          node scripts/clean-release.cjs
          pnpm run build
          pnpm exec electron-builder --mac dmg zip --x64 --arm64 --publish never
          node scripts/verify-release-output.cjs mac-release

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: litelauncher-macos
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  publish-release:
    name: Publish GitHub Release Assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: litelauncher-windows-x64
          path: artifacts/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: litelauncher-macos
          path: artifacts/macos

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release

          cp -v artifacts/windows/*.exe artifacts/release/ || true
          cp -v artifacts/windows/*.zip artifacts/release/ || true
          cp -v artifacts/windows/*.blockmap artifacts/release/ || true
          cp -v artifacts/windows/latest.yml artifacts/release/ || true
          cp -v artifacts/windows/ecdict-fts.db artifacts/release/ || true

          cp -v artifacts/macos/*.dmg artifacts/release/ || true
          cp -v artifacts/macos/*.zip artifacts/release/ || true
          cp -v artifacts/macos/*.blockmap artifacts/release/ || true
          cp -v artifacts/macos/latest-mac.yml artifacts/release/ || true

          ls -la artifacts/release

      - name: Create or update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes_zh="docs/releases/${tag}.zh-CN.md"
          notes_en="docs/releases/${tag}.md"
          if [ -f "${notes_zh}" ]; then
            notes_file="${notes_zh}"
          elif [ -f "${notes_en}" ]; then
            notes_file="${notes_en}"
          else
            notes_file=""
          fi

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            if [ -n "${notes_file}" ]; then
              gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --notes-file "${notes_file}"
            fi
          elif [ -n "${notes_file}" ]; then
            gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" --title "${tag}" --notes-file "${notes_file}"
          else
            gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" --title "${tag}" --generate-notes
          fi

      - name: Publish release if still draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Always publish this tag, but only mark it Latest when it is the
          # highest semver among existing releases. This avoids a slower older
          # CI run (e.g. v1.0.50 finishing after v1.0.51) stealing Latest.
          newest="$(
            {
              gh release list --repo "${GITHUB_REPOSITORY}" --limit 50 --json tagName -q '.[].tagName'
              printf '%s\n' "${tag}"
            } | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | sed 's/^v//' | sort -V | tail -n 1
          )"
          newest_tag="v${newest}"
          if [ "${newest_tag}" = "${tag}" ]; then
            gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
            echo "Marked ${tag} as Latest."
          else
            gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --draft=false
            echo "Published ${tag} without Latest (newer release is ${newest_tag})."
          fi

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" artifacts/release/* --repo "${GITHUB_REPOSITORY}" --clobber
