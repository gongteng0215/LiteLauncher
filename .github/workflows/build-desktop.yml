name: Build Desktop Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2025-vs2026
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows packages (NSIS + Portable)
        shell: pwsh
        run: |
          node scripts/clean-release.cjs
          pnpm run build
          pnpm exec electron-builder --win --x64 --publish never
          node scripts/verify-release-output.cjs win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: litelauncher-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml

  build-macos:
    name: macOS universal updater assets
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify mac signing inputs
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ] || [ -z "${CSC_KEY_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "Missing required Apple signing secrets for tag release packaging."
            echo "Expected secrets: APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD, APPLE_TEAM_ID"
            exit 1
          fi

      - name: Build macOS x64 + arm64 packages
        run: |
          node scripts/clean-release.cjs
          pnpm run build
          pnpm exec electron-builder --mac dmg zip --x64 --arm64 --publish never
          node scripts/verify-release-output.cjs mac-release

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: litelauncher-macos
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  publish-release:
    name: Publish GitHub Release Assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: litelauncher-windows-x64
          path: artifacts/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: litelauncher-macos
          path: artifacts/macos

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release

          cp -v artifacts/windows/*.exe artifacts/release/ || true
          cp -v artifacts/windows/*.zip artifacts/release/ || true
          cp -v artifacts/windows/*.blockmap artifacts/release/ || true
          cp -v artifacts/windows/latest.yml artifacts/release/ || true

          cp -v artifacts/macos/*.dmg artifacts/release/ || true
          cp -v artifacts/macos/*.zip artifacts/release/ || true
          cp -v artifacts/macos/*.blockmap artifacts/release/ || true
          cp -v artifacts/macos/latest-mac.yml artifacts/release/ || true

          ls -la artifacts/release

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes

      - name: Publish release if still draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" artifacts/release/* --repo "${GITHUB_REPOSITORY}" --clobber
