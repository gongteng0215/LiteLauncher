name: Set Latest Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to mark as GitHub Latest
        required: true
        default: v1.0.51
  push:
    branches:
      - main
    paths:
      - ".github/workflows/set-latest-release.yml"

permissions:
  contents: write

jobs:
  set-latest:
    name: Mark release as Latest
    runs-on: ubuntu-24.04
    steps:
      - name: Set latest release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-v1.0.51}"
          gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
          echo "Marked ${tag} as Latest."
          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json tagName,isLatest,isDraft
