<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiteSnap 长截图选区</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      /*
       * A fully transparent layered-window pixel is click-through on Windows,
       * even when BrowserWindow.setIgnoreMouseEvents(false) is active. Keep the
       * selected area barely non-zero alpha so it reliably receives wheel and
       * pointer events. Native long capture excludes layered windows, so this
       * hit-test surface can never appear in the saved image.
       */
      .guide {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        border: 2px dashed #9d63ff;
        background: rgba(0, 0, 0, .01);
      }
    </style>
  </head>
  <body>
    <div class="guide" aria-label="长截图选区"></div>
    <script>
      (() => {
        const block = (event) => {
          event.preventDefault();
          event.stopPropagation();
        };
        document.addEventListener("pointerdown", block, true);
        document.addEventListener("pointerup", block, true);
        document.addEventListener("dblclick", block, true);
        document.addEventListener("contextmenu", block, true);
        document.addEventListener("wheel", (event) => {
          block(event);
          if (Math.abs(event.deltaY) >= .5) {
            void window.launcher.liteSnapScrollLongCapture(event.deltaY);
          }
        }, { passive: false, capture: true });
        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            event.preventDefault();
            void window.launcher.liteSnapControlLongCapture("cancel");
          }
        });
      })();
    </script>
  </body>
</html>
