<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiteSnap 长截图</title>
    <link rel="stylesheet" href="./styles-theme.css" />
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      body { margin: 0; background: transparent; color: var(--ll-text); user-select: none; }
      main { box-sizing: border-box; min-height: 132px; padding: 12px 16px; border: 1px solid var(--ll-line-strong); border-radius: var(--ll-radius-card); background: rgba(var(--ll-surface-raised-rgb), .97); box-shadow: 0 12px 30px rgba(0,0,0,.35); }
      .top { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12px; color:var(--ll-text-accent); }
      .title { font-weight:700; color:var(--ll-text); font-size:13px; white-space:nowrap; }
      .meta, .hint { color:var(--ll-text-muted); }
      .meta { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
      .hint { margin-top:8px; font-size:12px; line-height:1.35; }
      .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
      button { min-height:36px; border:1px solid var(--ll-line-strong); border-radius:var(--ll-radius-control); padding:6px 12px; color:var(--ll-text); background:var(--ll-surface-input); cursor:pointer; font:inherit; font-size:12px; }
      button:hover { border-color:var(--ll-accent-hover); } button.primary { background:var(--ll-btn-primary-bg); border-color:var(--ll-btn-primary-border); color:var(--ll-btn-primary-fg); } button.danger { color:var(--ll-danger); } button:disabled { opacity:.5; cursor:default; }
      button:focus-visible { outline:1px solid var(--ll-accent-hover); box-shadow:var(--ll-focus-ring); }
    </style>
  </head>
  <body>
    <main>
      <div class="top"><span class="title">长截图（手动滚动）</span><span id="meta" class="meta">准备中…</span></div>
      <div class="hint">可向上或向下滚动；程序不会判断是否到底，也不会自动完成，只有你点击“完成并保存”才会结束。</div>
      <div class="actions">
        <button id="finish" class="primary" type="button">完成并保存</button>
        <button id="cancel" class="danger" type="button">取消</button>
      </div>
    </main>
    <script>
      (() => {
        const meta = document.getElementById("meta");
        const finish = document.getElementById("finish");
        const cancel = document.getElementById("cancel");
        const render = (state) => {
          const progress = state && state.longCapture;
          if (!progress) return;
          meta.textContent = `${progress.message} · ${progress.frameCount} 帧 · ${progress.stitchedHeight}px`;
          finish.disabled = progress.phase === "finishing" || progress.frameCount < 1;
          cancel.disabled = progress.phase === "finishing";
        };
        finish.addEventListener("click", () => window.launcher.liteSnapControlLongCapture("finish"));
        cancel.addEventListener("click", () => window.launcher.liteSnapControlLongCapture("cancel"));
        window.launcher.onLiteSnapOverlayStateChanged(render);
        window.launcher.liteSnapGetLongCaptureProgress()
          .then((progress) => render({ longCapture: progress }))
          .catch(() => undefined);
      })();
    </script>
  </body>
</html>
